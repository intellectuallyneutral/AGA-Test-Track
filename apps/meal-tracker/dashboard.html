<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <meta name="description" content="Admin dashboard for Isabelle's meal, medicine, and symptom tracker">
    <title>Dashboard — Isabelle's Tracker</title>
    <meta name="theme-color" content="#3B82F6">
    <link rel="stylesheet" href="css/styles.css?v=2">
</head>
<body class="dark-theme">

<!-- Password Gate -->
<div class="password-modal" id="password-modal">
    <div class="card">
        <div class="lock-icon">🔒</div>
        <h2>Dashboard Access</h2>
        <p>Enter the admin password to continue.</p>
        <form onsubmit="authenticate(event)">
            <div class="form-group">
                <input type="password" id="auth-password" class="form-input" placeholder="Password" required autofocus>
            </div>
            <button type="submit" class="btn-primary">Unlock</button>
        </form>
    </div>
</div>

<!-- Dashboard Content -->
<div id="dashboard-content" style="display:none;">
    <div class="page-container">

        <!-- Print Header -->
        <div class="print-header">
            <h1>Isabelle's Tracker Report</h1>
            <p id="print-date-range"></p>
        </div>

        <header class="app-header" style="text-align:left;padding-bottom:0;">
            <h1 class="title">📊 Dashboard</h1>
            <p class="subtitle">View and manage Isabelle's tracker data</p>
        </header>

        <!-- Date Filter -->
        <div class="date-filter">
            <div class="form-group">
                <label class="form-label" for="filter-start">From</label>
                <input type="date" id="filter-start" class="form-input">
            </div>
            <div class="form-group">
                <label class="form-label" for="filter-end">To</label>
                <input type="date" id="filter-end" class="form-input">
            </div>
            <button class="btn-secondary" onclick="loadData()">Apply</button>
            <button class="btn-secondary" onclick="setQuickFilter('today')">Today</button>
            <button class="btn-secondary" onclick="setQuickFilter('week')">7 Days</button>
            <button class="btn-secondary" onclick="setQuickFilter('all')">All</button>
            <button class="btn-export" onclick="exportPDF()">📄 Export PDF</button>
        </div>

        <!-- Stats -->
        <div class="stats-grid">
            <div class="card stat-card">
                <div class="icon meals">🍕</div>
                <div>
                    <div class="value" id="stat-meals">0</div>
                    <p class="label">Foods</p>
                </div>
            </div>
            <div class="card stat-card">
                <div class="icon drinks">🥤</div>
                <div>
                    <div class="value" id="stat-drinks">0</div>
                    <p class="label">Drinks</p>
                </div>
            </div>
            <div class="card stat-card">
                <div class="icon medicines">💊</div>
                <div>
                    <div class="value" id="stat-medicines">0</div>
                    <p class="label">Medicines</p>
                </div>
            </div>
            <div class="card stat-card">
                <div class="icon symptoms">🩺</div>
                <div>
                    <div class="value" id="stat-symptoms">0</div>
                    <p class="label">Symptoms</p>
                </div>
            </div>
            <div class="card stat-card">
                <div class="icon people">👥</div>
                <div>
                    <div class="value" id="stat-people">0</div>
                    <p class="label">Contributors</p>
                </div>
            </div>
        </div>

        <!-- View Toggle -->
        <div class="section-title">
            <h2>Activity Log</h2>
            <div class="view-toggle">
                <button class="active" onclick="setView('timeline', this)">Timeline</button>
                <button onclick="setView('table', this)">Table</button>
            </div>
        </div>

        <div class="loading-spinner" id="loading" style="display:none;"></div>

        <div id="timeline-view">
            <div id="timeline-container"></div>
        </div>
        <div id="table-view" style="display:none;">
            <div id="table-container"></div>
        </div>

        <!-- Correlations -->
        <div class="section-title" style="margin-top:48px;">
            <h2>🔍 Symptom-Meal Correlations</h2>
        </div>
        <div id="correlations-container"></div>

    </div>
</div>

<!-- Delete Bar -->
<div class="delete-bar" id="delete-bar" style="display:none;">
    <span id="delete-count">0 selected</span>
    <button class="btn-delete" onclick="deleteSelected()">🗑️ Delete</button>
</div>

<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<script src="js/supabase-config.js?v=2"></script>
<script src="js/timezone.js?v=2"></script>
<script src="js/dashboard.js?v=2"></script>
</body>
</html>
